<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Whole Story · Event wall</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{--cream:#F8F3E8;--card:#FBF8F2;--line:#ECE6DB;--green:#12563E;--coral:#C0533E;--navy:#0F1B33;--ink:#1D2430;--grey:#5A6066;--red:#C0392B}
  *{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:15px/1.45 Inter,system-ui,sans-serif}
  main{max-width:560px;margin:0 auto;padding:16px 18px 60px}
  .top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .brand{display:flex;align-items:center;gap:8px;font:600 22px Newsreader,Georgia,serif;color:var(--navy)}
  h1{font:600 28px/1.12 Newsreader,Georgia,serif;color:var(--navy);margin:14px 0 4px}
  h2{font:600 20px Newsreader,Georgia,serif;color:var(--navy);margin:18px 0 8px}
  .muted{color:var(--grey);font-size:13.5px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}
  input,textarea,select{width:100%;font:15px Inter,sans-serif;padding:12px;border:1px solid #E0D9CD;border-radius:12px;background:#fff;color:var(--ink)}
  textarea{min-height:96px;resize:vertical}label{font-weight:600;font-size:13px;display:block;margin:12px 0 6px}
  .btn{font:500 15.5px Inter,sans-serif;border:0;border-radius:26px;padding:13px 18px;background:var(--green);color:#fff;width:100%;margin:8px 0;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
  .btn.coral{background:var(--coral)}.btn.ol{background:var(--card);color:var(--ink);border:1px solid #D8D2C6}.btn:disabled{opacity:.5}
  .btn-row{display:flex;gap:10px;margin:14px 0}.btn-row .btn{margin:0}
  .cover{width:calc(100% + 36px);margin:12px -18px 0;height:210px;object-fit:cover;display:block}
  .invite-card{margin-top:-32px;position:relative;z-index:2;text-align:center;box-shadow:0 8px 24px rgba(15,27,51,.08)}
  .tabs{display:flex;border-bottom:1px solid var(--line);margin:10px 0 12px}
  .tab{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:10px 4px;font:500 14px Inter,sans-serif;color:var(--grey);cursor:pointer}
  .tab.on{color:var(--navy);font-weight:600;border-color:var(--green)}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px}
  .chip{flex:none;border:1px solid #D8D2C6;background:var(--card);border-radius:18px;padding:6px 12px;font:13px Inter,sans-serif;cursor:pointer;color:var(--ink)}
  .chip.on{background:var(--green);border-color:var(--green);color:#fff}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .grid img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:10px;display:block}
  .thumbs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.thumbs img{width:76px;height:76px;object-fit:cover;border-radius:10px;cursor:pointer}
  .drop{border:1.5px dashed #CFC8BA;border-radius:14px;padding:20px;text-align:center;background:#fff;margin-top:8px}
  .post img{width:100%;max-height:380px;object-fit:cover;border-radius:12px;margin-top:8px}
  .meta{font-size:12.5px;color:var(--grey);display:flex;justify-content:space-between;align-items:center}
  .del{color:var(--red);background:none;border:0;padding:0;font:500 12.5px Inter,sans-serif;text-decoration:underline;cursor:pointer}
  .cm{font-size:13.5px;margin:6px 0}.cm b{font-weight:600}
  .cmrow{display:flex;gap:8px;margin-top:8px}.cmrow input{flex:1;padding:8px 12px;border-radius:18px}.cmrow button{width:auto;margin:0;padding:8px 14px;font-size:13px;border-radius:18px;background:var(--green);color:#fff;border:0;cursor:pointer}
  .modal-bg{position:fixed;inset:0;background:rgba(15,27,51,.48);display:flex;align-items:flex-end;justify-content:center;z-index:20}
  .modal{background:var(--cream);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px}
  .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .close-x{background:none;border:0;font-size:22px;color:var(--grey);cursor:pointer;padding:4px 8px}
  .rec-circle{width:84px;height:84px;border-radius:42px;border:0;background:var(--coral);color:#fff;font-size:26px;cursor:pointer;display:flex;align-items:center;justify-content:center;margin:14px auto 8px}
  .rec-circle.on{background:var(--red)}
  .notice{background:#F3D9D4;border-color:#EBC0B8}
</style>
</head>
<body>
<main>
  <div class="top">
    <div class="brand">Whole Story
      <svg width="96" height="26" viewBox="0 0 160 42"><path d="M0 36 C28 32 40 10 70 12 S112 36 130 24 S150 12 160 14" fill="none" stroke="#9AA58F" stroke-width="1.3"/><circle cx="48" cy="16" r="6" fill="#F5A623"/><circle cx="80" cy="14" r="6" fill="#1D6FF2"/><circle cx="116" cy="29" r="6" fill="#2F9E6B"/><circle cx="150" cy="13" r="6" fill="#E8402B"/></svg>
    </div>
    <span class="muted" style="font-size:12px">No app download needed</span>
  </div>
  <div id="app"><p class="muted">Loading the event…</p></div>
</main>
<div id="modal-root"></div>
<script src="./config.js"></script>
<script type="module">
const SUPABASE_URL = window.WHOLESTORY_CONFIG?.url || '';
const SUPABASE_ANON_KEY = window.WHOLESTORY_CONFIG?.key || '';
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm';
const sb = SUPABASE_URL && SUPABASE_ANON_KEY ? createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: false } }) : null;
const $ = s => document.querySelector(s), app = $('#app'), modalRoot = $('#modal-root');
const code = new URLSearchParams(location.search).get('e') || '';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const token = localStorage.getItem('ws_guest_token') || (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2));
localStorage.setItem('ws_guest_token', token);

let ev = null, joined = !!localStorage.getItem('ws_guest_name'), wallTab = 'photos', momentTab = 'all', posts = [];
let photos = [], audio = null, audioMs = 0, rec = null, chunks = [], t0 = 0, storyTab = 'record';
const pub = p => sb.storage.from('event-media').getPublicUrl(p).data.publicUrl;
const fmtDate = d => d ? new Date(d).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) : '';

async function load() {
  if (!sb) { app.innerHTML = '<h1>Event page unavailable</h1><p class="muted">Please contact the host for a working event link.</p>'; return; }
  const { data, error } = await sb.rpc('guest_event', { c: code });
  if (error || !data) { app.innerHTML = '<h1>Event not found</h1><p class="muted">Check the link or QR code you were sent.</p>'; return; }
  ev = data; render(); listPosts();
}

function render() {
  const open = ev.is_open && ev.allow_guest_uploads;
  const savedName = localStorage.getItem('ws_guest_name') || '';
  if (!joined) {
    app.innerHTML = `
      ${ev.cover_path ? `<img class="cover" src="${esc(pub(ev.cover_path))}" alt="">` : ''}
      <div class="card invite-card">
        <p class="muted" style="margin:0">You’re invited to</p>
        <h1 style="margin:6px 0">${esc(ev.name)}</h1>
        <p class="muted" style="margin:4px 0 14px">${[fmtDate(ev.starts_on), esc(ev.place)].filter(Boolean).join(' · ')}</p>
        <label for="join-nm" style="text-align:left">Your name</label>
        <input id="join-nm" value="${esc(savedName)}" placeholder="Enter your name" autocomplete="name">
        <button class="btn" id="join-btn" style="margin-top:12px">Continue as guest →</button>
        <p class="muted" style="font-size:12px;margin:8px 0 0">No app download needed · Just a link or QR code</p>
      </div>`;
    $('#join-btn').onclick = () => {
      const nm = $('#join-nm').value.trim();
      if (!nm) return alert('Please enter your name to continue.');
      localStorage.setItem('ws_guest_name', nm);
      joined = true; render(); drawWall();
    };
    return;
  }

  const ms = ev.moments || [];
  app.innerHTML = `
    ${ev.cover_path ? `<img class="cover" src="${esc(pub(ev.cover_path))}" alt="">` : ''}
    <h1>${esc(ev.name)}</h1>
    <p class="muted">${[fmtDate(ev.starts_on), esc(ev.place)].filter(Boolean).join(' · ')} · Signed in as <b>${esc(savedName)}</b> (<button class="del" id="chg-name" style="color:var(--green)">change</button>)</p>
    ${open ? `
      <div class="btn-row">
        <button class="btn" id="open-photos">📷 Add photos</button>
        <button class="btn coral" id="open-story">🎙 Tell a story</button>
      </div>` : `<div class="card notice">This wall is closed to new photos and stories.</div>`}
    <div class="tabs">
      <button class="tab ${wallTab === 'photos' ? 'on' : ''}" id="tab-photos">Photos</button>
      <button class="tab ${wallTab === 'stories' ? 'on' : ''}" id="tab-stories">Stories</button>
    </div>
    ${ms.length ? `<div class="chips" id="mchips"><button class="chip ${momentTab === 'all' ? 'on' : ''}" data-t="all">All</button>${ms.map(m => `<button class="chip ${momentTab === m.id ? 'on' : ''}" data-t="${m.id}">${esc(m.name)}</button>`).join('')}</div>` : ''}
    <div id="wall"><p class="muted">Loading…</p></div>`;

  $('#chg-name').onclick = () => { joined = false; render(); };
  $('#tab-photos').onclick = () => { wallTab = 'photos'; render(); drawWall(); };
  $('#tab-stories').onclick = () => { wallTab = 'stories'; render(); drawWall(); };
  document.querySelectorAll('#mchips .chip').forEach(b => b.onclick = () => { momentTab = b.dataset.t; render(); drawWall(); });
  if (open) {
    $('#open-photos').onclick = () => openModal('photos');
    $('#open-story').onclick = () => openModal('story');
  }
  drawWall();
}

function openModal(kind) {
  photos = []; audio = null; audioMs = 0; storyTab = 'record';
  const ms = ev.moments || [];
  const momSelect = ms.length ? `<label for="mom">Moment (optional)</label><select id="mom"><option value="">Choose a moment</option>${ms.map(m => `<option value="${m.id}">${esc((m.time_label ? m.time_label + ' · ' : '') + m.name)}</option>`).join('')}</select>` : '';
  if (kind === 'photos') {
    modalRoot.innerHTML = `<div class="modal-bg"><div class="modal">
      <div class="modal-head"><h2 style="margin:0">Add photos</h2><button class="close-x" id="mclose">✕</button></div>
      <div class="drop"><p class="muted" style="margin:0 0 10px">Choose favourite photos from your device</p><input id="files" type="file" accept="image/*" multiple></div>
      <div class="thumbs" id="thumbs"></div>
      ${momSelect}
      <button class="btn" id="send-btn" style="margin-top:14px">Add to event →</button>
    </div></div>`;
  } else {
    modalRoot.innerHTML = `<div class="modal-bg"><div class="modal">
      <div class="modal-head"><h2 style="margin:0">Tell a story</h2><button class="close-x" id="mclose">✕</button></div>
      <div class="tabs"><button class="tab on" id="st-rec">Record</button><button class="tab" id="st-write">Write</button></div>
      <div id="st-rec-pane" style="text-align:center">
        <button class="rec-circle" id="recbtn">🎙</button>
        <div id="recinfo" class="muted">Tap to record a voice story</div>
      </div>
      <div id="st-write-pane" style="display:none">
        <label for="tx">Your story</label>
        <textarea id="tx" placeholder="Share a memory, a message or what this moment meant to you…"></textarea>
      </div>
      <label>Add a photo (optional)</label><input id="files" type="file" accept="image/*" multiple>
      <div class="thumbs" id="thumbs"></div>
      ${momSelect}
      <button class="btn" id="send-btn" style="margin-top:14px">Save story →</button>
    </div></div>`;
    $('#st-rec').onclick = () => { $('#st-rec').classList.add('on'); $('#st-write').classList.remove('on'); $('#st-rec-pane').style.display = 'block'; $('#st-write-pane').style.display = 'none'; };
    $('#st-write').onclick = () => { $('#st-write').classList.add('on'); $('#st-rec').classList.remove('on'); $('#st-rec-pane').style.display = 'none'; $('#st-write-pane').style.display = 'block'; };
    $('#recbtn').onclick = toggleRec;
  }
  $('#mclose').onclick = () => { if (rec && rec.state === 'recording') rec.stop(); modalRoot.innerHTML = ''; };
  $('#files').onchange = e => { photos = [...photos, ...e.target.files]; drawThumbs(); };
  $('#send-btn').onclick = () => send(kind);
}

function drawThumbs() {
  const box = $('#thumbs'); if (!box) return;
  box.querySelectorAll('img').forEach(im => URL.revokeObjectURL(im.src));
  box.innerHTML = photos.map((f, i) => `<img src="${URL.createObjectURL(f)}" alt="" data-i="${i}" title="Tap to remove">`).join('');
  box.querySelectorAll('img').forEach(im => im.onclick = () => { photos.splice(+im.dataset.i, 1); drawThumbs(); });
}

async function shrinkPhoto(file) {
  const url = URL.createObjectURL(file);
  try {
    const image = new Image(); image.src = url; await image.decode();
    const scale = Math.min(1, 2048 / Math.max(image.naturalWidth, image.naturalHeight));
    const canvas = document.createElement('canvas');
    canvas.width = Math.max(1, Math.round(image.naturalWidth * scale));
    canvas.height = Math.max(1, Math.round(image.naturalHeight * scale));
    canvas.getContext('2d').drawImage(image, 0, 0, canvas.width, canvas.height);
    return await new Promise((resolve, reject) => canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error('Could not prepare photo.')), 'image/jpeg', 0.8));
  } finally { URL.revokeObjectURL(url); }
}

async function toggleRec() {
  const b = $('#recbtn');
  let stream;
  if (rec && rec.state === 'recording') { b.disabled = true; $('#send-btn').disabled = true; rec.stop(); return; }
  try {
    b.disabled = true; stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    rec = new MediaRecorder(stream); chunks = []; t0 = Date.now();
    rec.ondataavailable = e => chunks.push(e.data);
    rec.onstop = () => {
      b.disabled = false; $('#send-btn').disabled = false; stream.getTracks().forEach(t => t.stop());
      audio = new Blob(chunks, { type: rec.mimeType || 'audio/webm' }); audioMs = Date.now() - t0;
      b.classList.remove('on'); b.textContent = '🎙';
      $('#recinfo').innerHTML = `Recorded ${Math.round(audioMs / 1000)}s · <button class="del" id="delrec">Delete</button>`;
      $('#delrec').onclick = () => { audio = null; audioMs = 0; $('#recinfo').textContent = 'Tap to record a voice story'; };
    };
    rec.start(); b.disabled = false; b.classList.add('on'); b.textContent = '■'; $('#recinfo').textContent = 'Recording… tap to stop';
  } catch { stream?.getTracks().forEach(t => t.stop()); b.disabled = false; alert('Your browser did not allow the microphone.'); }
}

async function upload(fileOrBlob, ext) {
  const path = `${ev.id}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
  const { error } = await sb.storage.from('event-media').upload(path, fileOrBlob, { contentType: fileOrBlob.type || undefined });
  if (error) throw error; return path;
}

async function send(kind) {
  if (rec && rec.state === 'recording') return alert('Stop the recording before saving.');
  const name = localStorage.getItem('ws_guest_name') || '';
  const text = $('#tx') ? $('#tx').value.trim() : '';
  if (!name) return alert('Please enter your name.');
  if (kind === 'photos' && !photos.length) return alert('Choose at least one photo.');
  if (kind === 'story' && !photos.length && !text && !audio) return alert('Record your voice, write a story, or add a photo.');
  const btn = $('#send-btn'); btn.disabled = true; btn.textContent = 'Saving…';
  try {
    const paths = [];
    for (const f of photos) paths.push(await upload(await shrinkPhoto(f), 'jpg'));
    const ap = audio ? await upload(audio, audio.type.includes('mp4') ? 'm4a' : 'webm') : null;
    const mom = $('#mom') ? ($('#mom').value || null) : null;
    const { error } = await sb.rpc('guest_add_post', { c: code, gname: name, gtoken: token, body: text, photo_paths: paths, audio: ap, dur: audio ? audioMs : null, moment: mom });
    if (error) throw error;
    photos = []; audio = null; modalRoot.innerHTML = ''; listPosts();
    alert(ev.require_approval ? 'Sent to the hosts for approval. Thank you!' : 'Added to the event wall. Thank you!');
  } catch (e) { alert('Could not add: ' + (e.message || e)); btn.disabled = false; btn.textContent = 'Try again'; }
}

async function listPosts() {
  const { data, error } = await sb.rpc('guest_posts', { c: code, gtoken: token });
  if (error) { const w = $('#wall'); if (w) w.innerHTML = '<p class="muted">Could not load the wall.</p>'; return; }
  posts = data || []; drawWall();
}

function drawWall() {
  const box = $('#wall'); if (!box || !joined) return;
  const shown = momentTab === 'all' ? posts : posts.filter(p => p.moment_id === momentTab);
  const mName = id => ((ev.moments || []).find(m => m.id === id) || {}).name;
  if (wallTab === 'photos') {
    const allPhotos = shown.flatMap(p => p.photos || []);
    if (!allPhotos.length) { box.innerHTML = '<div class="card"><p class="muted" style="margin:0">No photos added yet. Tap Add photos above.</p></div>'; return; }
    box.innerHTML = `<div class="grid">${allPhotos.map(x => `<img src="${esc(pub(x))}" alt="" loading="lazy">`).join('')}</div>`;
    return;
  }
  const storyItems = shown.filter(p => p.text || p.audio_path || (p.photos || []).length);
  if (!storyItems.length) { box.innerHTML = '<div class="card"><p class="muted" style="margin:0">No stories yet. Tap Tell a story above.</p></div>'; return; }
  const canComment = ev.is_open;
  box.innerHTML = storyItems.map(p => `<div class="card post"><div class="meta"><span><b>${esc(p.guest_name || 'Host')}</b>${p.mine ? ' (you)' : ''}${mName(p.moment_id) ? ' · ' + esc(mName(p.moment_id)) : ''}</span>${p.mine ? `<button class="del" data-del="${p.id}">Delete</button>` : ''}</div>
    ${(p.photos || []).map(x => `<img src="${esc(pub(x))}" alt="" loading="lazy">`).join('')}
    ${p.text ? `<p style="font:17px/1.4 Newsreader,Georgia,serif;margin:8px 0">${esc(p.text)}</p>` : ''}
    ${p.audio_path ? `<audio controls src="${esc(pub(p.audio_path))}" style="width:100%;margin-top:8px"></audio>` : ''}
    ${(p.comments || []).map(c => `<div class="cm"><b>${esc(c.name)}${c.mine ? ' (you)' : ''}</b> ${esc(c.text)} ${c.mine ? `<button class="del" data-delc="${c.id}">Delete</button>` : ''}</div>`).join('')}
    ${canComment ? `<div class="cmrow"><input placeholder="Add a comment…" data-cin="${p.id}"><button data-cpost="${p.id}">Post</button></div>` : ''}</div>`).join('');
  box.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => { if (!confirm('Delete what you added?')) return; const { error } = await sb.rpc('guest_delete_post', { pid: b.dataset.del, gtoken: token }); if (error) return alert('Could not delete: ' + error.message); listPosts(); });
  box.querySelectorAll('[data-delc]').forEach(b => b.onclick = async () => { const { error } = await sb.rpc('guest_delete_comment', { cid: b.dataset.delc, gtoken: token }); if (error) return alert('Could not delete comment: ' + error.message); listPosts(); });
  box.querySelectorAll('[data-cpost]').forEach(b => b.onclick = async () => {
    const input = box.querySelector(`[data-cin="${b.dataset.cpost}"]`), body = input.value.trim();
    const name = localStorage.getItem('ws_guest_name') || prompt('Your name') || '';
    if (!body || !name.trim()) return;
    localStorage.setItem('ws_guest_name', name.trim());
    const { error } = await sb.rpc('guest_add_comment', { c: code, gname: name.trim(), gtoken: token, pid: b.dataset.cpost, body });
    if (error) return alert('Could not post: ' + error.message);
    listPosts();
  });
}

load().catch(() => { app.textContent = 'Could not load this event. Check your connection and reload.'; });
const refreshTimer = setInterval(() => { if (ev && !document.hidden) listPosts().catch(() => {}); }, 15000);
window.addEventListener('pagehide', () => { clearInterval(refreshTimer); if (rec && rec.state === 'recording') rec.stop(); });
</script>
</body>
</html>
