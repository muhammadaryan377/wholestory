name: Prepare Expo Location for this feature branch
on:
  push:
    branches: [feature/whole-stories-intro-swipe]
    paths: [.github/workflows/prepare-expo-location.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install expo-location@~58.0.18 --package-lock-only --no-audit --no-fund
      - name: Commit package and lockfile changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'Install SDK 58-compatible expo-location for opt-in story GPS'
            git push origin HEAD:feature/whole-stories-intro-swipe
          fi
